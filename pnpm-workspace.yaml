$schema: 'https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/pnpm-workspace.json'
packages:
  - apps/*
  - e2e/*
  - libs/*
  - packages/*

catalogs:
  angular:
    '@angular/build': '~22.1.6'
    '@angular/cli': '~22.1.6'
    '@angular/common': '~22.1.4'
    '@angular/compiler': '~22.1.4'
    '@angular/compiler-cli': '~22.1.4'
    '@angular/core': '~22.1.4'
    '@angular/forms': '~22.1.4'
    '@angular/platform-browser': '~22.1.4'
    '@angular/router': '~22.1.4'
    'angular-eslint': '~22.1.0'
    'typescript': '~6.0.3'
  frontend:
    '@tailwindcss/postcss': '~4.3.3'
    'postcss': '~8.5.26'
    'rxjs': '~7.8.2'
    'tailwindcss': '~4.3.3'
    'tslib': '~2.8.1'
  testing:
    '@playwright/test': '~1.62.1'
    '@vitest/browser-playwright': '~4.1.11'
    '@vitest/coverage-v8': '~4.1.11'
    '@vitest/ui': '~4.1.11'
    'playwright': '~1.62.1'
    'vitest': '~4.1.11'
  tooling:
    '@commitlint/cli': '~21.2.2'
    '@commitlint/config-conventional': '~21.2.2'
    '@eslint/js': '~10.0.1'
    '@moonrepo/cli': '~2.5.3'
    '@types/node': '~24.13.3'
    'eslint': '~10.9.1'
    'eslint-config-prettier': '~10.1.8'
    'husky': '~9.1.7'
    'jiti': '~2.7.0'
    'lint-staged': '~17.4.1'
    'markdownlint-cli2': '~0.23.2'
    'prettier': '~3.9.6'
    'prettier-plugin-organize-imports': '~4.3.0'
    'prettier-plugin-tailwindcss': '~0.8.1'
    'stylelint': '~17.14.1'
    'stylelint-config-clean-order': '~10.0.0'
    'stylelint-config-standard-scss': '~17.0.0'
    'stylelint-order': '~8.1.1'
    'typescript': '~6.0.3'
    'typescript-eslint': '~8.68.0'

savePrefix: '~'

minimumReleaseAge: 4320
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'chokidar@4.0.3 || 5.0.0'
  - 'semver@6.3.1 || 7.7.4 || 7.8.5'
engineStrict: true
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  'msgpackr-extract': true
