$schema: 'https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/pnpm-workspace.json'
packages:
  - apps/*
  - e2e/*
  - libs/*
  - packages/*

catalogs:
  angular:
    '@angular/build': '~22.1.3'
    '@angular/cli': '~22.1.3'
    '@angular/common': '~22.1.0'
    '@angular/compiler': '~22.1.0'
    '@angular/compiler-cli': '~22.1.0'
    '@angular/forms': '~22.1.0'
    '@angular/platform-browser': '~22.1.0'
    '@angular/router': '~22.1.0'
    'angular-eslint': '~22.1.0'
    'typescript': '~6.0.3'
  tooling:
    '@commitlint/cli': '~21.2.1'
    '@commitlint/config-conventional': '~21.2.0'
    '@eslint/js': '~10.0.1'
    '@moonrepo/cli': '~2.4.6'
    '@types/node': '~24.13.3'
    'eslint': '~10.8.0'
    'eslint-config-prettier': '~10.1.8'
    'husky': '~9.1.7'
    'jiti': '~2.7.0'
    'lint-staged': '~17.3.0'
    'markdownlint-cli2': '~0.23.2'
    'prettier': '~3.9.6'
    'prettier-plugin-organize-imports': '~4.3.0'
    'prettier-plugin-tailwindcss': '~0.8.1'
    'stylelint': '~17.14.1'
    'stylelint-config-clean-order': '~10.0.0'
    'stylelint-config-standard-scss': '~17.0.0'
    'stylelint-order': '~8.1.1'
    'typescript': '~6.0.3'
    'typescript-eslint': '~8.66.0'

savePrefix: '~'

minimumReleaseAge: 4320
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'chokidar@4.0.3 || 5.0.0'
  - 'semver@6.3.1 || 7.7.4 || 7.8.5'
engineStrict: true
allowBuilds:
  '@parcel/watcher@2.5.6': true
  'esbuild@0.27.7 || 0.28.1': true
  lmdb: true
  'lmdb@3.5.4': true
  'msgpackr-extract@3.0.4': true
